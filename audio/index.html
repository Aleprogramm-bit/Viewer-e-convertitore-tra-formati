<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Universal Audio Viewer & Converter</title>
  <style>
    body { font-family: Arial; background:#111; color:#fff; text-align:center; }
    #viewer { margin-top:20px; }
    audio { width:90%; margin-top:20px; }
    #controls { margin-top:20px; }
    select, button { padding:8px 12px; margin:5px; }
    #info { margin-top:15px; font-size:14px; color:#aaa; }
  </style>
</head>
<body>

  <h1>Universal Audio Viewer & Converter</h1>

  <input type="file" id="fileInput">

  <div id="viewer"></div>

  <div id="controls">
    <label>Converti in:</label>
    <select id="formatSelect">
      <option value="mp3">MP3</option>
      <option value="wav">WAV</option>
      <option value="ogg">OGG</option>
    </select>
    <button id="btnConvert">Scarica convertito</button>
  </div>

  <div id="info"></div>

  <script src="ffmpeg.min.js"></script>
  <script src="audio-viewer.js"></script>
</body>
</html>
