<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Image Viewer & Converter</title>
  <style>
    body { font-family: Arial; background:#111; color:#fff; text-align:center; }
    #viewer { margin-top:20px; }
    canvas, img { max-width:90%; border:1px solid #444; }
    #controls { margin-top:20px; }
    select, button { padding:8px 12px; margin:5px; }
  </style>
</head>
<body>

  <h1>Universal Image Viewer & Converter</h1>

  <input type="file" id="fileInput" accept="image/*">
  <div id="viewer"></div>

  <div id="controls">
    <label>Converti in:</label>
    <select id="formatSelect">
      <option value="image/png">PNG</option>
      <option value="image/jpeg">JPG</option>
      <option value="image/webp">WebP</option>
    </select>
    <button id="btnConvert">Scarica convertito</button>
  </div>

  <script src="viewer.js"></script>
</body>
</html>
