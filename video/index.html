<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Universal Video Viewer & Converter</title>
  <style>
    body { font-family: Arial; background:#111; color:#fff; text-align:center; }
    #viewer { margin-top:20px; }
    video { max-width:90%; border:1px solid #444; }
    #controls { margin-top:20px; }
    select, button { padding:8px 12px; margin:5px; }
  </style>
</head>
<body>

  <h1>Universal Video Viewer & Converter</h1>

  <input type="file" id="fileInput" accept="video/*">
  <div id="viewer"></div>

  <div id="controls">
    <label>Converti in:</label>
    <select id="formatSelect">
      <option value="mp4">MP4</option>
      <option value="webm">WebM</option>
      <option value="ogg">Ogg</option>
    </select>
    <button id="btnConvert">Scarica convertito</button>
  </div>

  <script src="ffmpeg.min.js"></script>
  <script src="video-viewer.js"></script>
</body>
</html>
